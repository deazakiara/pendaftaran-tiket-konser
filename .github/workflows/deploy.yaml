name: Laravel 13 CI/CD Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Run Tests and Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install NPM dependencies and build assets
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Run Laravel tests
        run: composer test

  deploy:
    name: Deploy to hosting
    needs: laravel-tests
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production assets
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package production dependencies and assets
        run: tar -czf release-bundle.tar.gz vendor public/build

      - name: Upload package to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: release-bundle.tar.gz
          target: ${{ secrets.APP_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_PATH
          script: |
            set -e
            cd "$APP_PATH"
            git pull --ff-only origin main
            rm -rf vendor public/build
            tar -xzf release-bundle.tar.gz
            rm release-bundle.tar.gz
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
