# =============================================================
# Deploy otomatis ke server (VPS) setiap ada push ke branch main.
#
# PENTING: GitHub hanya membaca workflow di folder .github/workflows/
# Jadi di repo Laravel kamu, file ini harus ada di:
#   .github/workflows/deploy.yaml
#
# Isi dulu Secrets di GitHub:
#   Settings > Secrets and variables > Actions > New repository secret
#     SSH_HOST  = IP atau domain server, misal 103.10.20.30
#     SSH_USER  = user untuk login SSH, misal deploy
#     SSH_KEY   = isi private key SSH (seluruh isi file id_ed25519)
#     SSH_PORT  = port SSH (boleh dikosongkan kalau pakai 22)
#     APP_PATH  = folder project di server, misal /var/www/konser
#
# File .env TIDAK ikut di-deploy. Buat sekali secara manual di server
# (isi APP_KEY, DB_* dan MAIL_* di sana), setelah itu tidak perlu diubah lagi.
# =============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

# Kalau ada 2 push berdekatan, deploy jalan bergantian, tidak bareng
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy lewat SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Berhenti di langkah pertama yang gagal.
            # Kalau gagal, situs tetap di mode maintenance: cek log di tab Actions,
            # perbaiki, lalu push lagi (atau jalankan "php artisan up" di server).
            set -e
            cd "${{ secrets.APP_PATH }}"

            # 1. Tampilkan halaman maintenance selama update
            php artisan down || true

            # 2. Ambil kode terbaru dari GitHub
            #    (.env dan isi storage/ tidak tersentuh karena tidak ada di git)
            git fetch origin main
            git reset --hard origin/main

            # 3. Install library PHP, tanpa paket khusus development
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 4. Update tabel database (misal tabel registrations)
            php artisan migrate --force

            # 5. Simpan cache config, route, dan view supaya situs lebih cepat
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 6. Buka lagi situsnya
            php artisan up
